<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Moto Prime{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .content {
            flex: 1;
            display: flex;
        }

        .sidebar {
            width: 250px;
            background: #000000;
            padding: 15px;
        }

        .main {
            flex: 1;
            padding: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/">Moto Prime</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#topNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="topNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/">Motos</a></li>
                <li class="nav-item"><a class="nav-link" href="/novo/">Cadastrar moto</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="content">

    <div class="sidebar d-none d-md-block">
        <h5 class="text-white">Menu</h5>
        <ul class="nav flex-column">
            <li class="nav-item"><a class="nav-link text-white" href="/">Estoque de motos</a></li>
            <li class="nav-item"><a class="nav-link text-white" href="/novo/">Nova moto</a></li>
        </ul>
    </div>

    <div class="main">
        {% block content %}
        {% endblock %}
    </div>

</div>

<footer class="bg-dark text-white text-center p-3">
    <small>© 2026 Moto Prime - Concessionária de Motos</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
